version: '3.8'
services:
  api:
    build: .
    image: genestac-backend:dev
    container_name: genestac-api-dev
    restart: always
    ports:
      - "8000:8000"
    dns:
      - 10.68.116.156
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
